<!-- Site-wide promo banner — Claude Code for Research -->
<div id="promo-banner">
  <div class="banner-main">
    <span class="banner-text">
      <strong>New course:</strong> Join
      <a href="https://thecausalmindset.com/training/claude-code-for-research" target="_blank" rel="noopener">
        Claude Code for Research
      </a>
    </span>
    <button class="banner-toggle" id="banner-toggle-btn" aria-expanded="false" aria-controls="banner-details">
      Learn more &#9662;
    </button>
  </div>
  <div id="banner-details" class="banner-details">
    <p>
      Agentic AI is where the frontier is happening. Some top researchers are already using it to accelerate their work — others don't know where to start. This course takes you from zero to frontier-level research workflows with Claude Code.
    </p>
    <a href="https://thecausalmindset.com/training/claude-code-for-research" target="_blank" rel="noopener" class="banner-cta-btn">
      Join the course &rarr;
    </a>
  </div>
</div>
<script>
(function() {
  var banner   = document.getElementById('promo-banner');
  var details  = document.getElementById('banner-details');
  var btn      = document.getElementById('banner-toggle-btn');
  var navbar   = null;
  var expanded = false;

  function recalc() {
    if (!navbar) navbar = document.querySelector('nav.navbar');
    var h = banner.offsetHeight;
    if (navbar) navbar.style.top = h + 'px';
    document.body.style.paddingTop = (h + (navbar ? navbar.offsetHeight : 56)) + 'px';
  }

  btn.addEventListener('click', function() {
    expanded = !expanded;
    if (expanded) {
      details.style.maxHeight = details.scrollHeight + 'px';
      btn.setAttribute('aria-expanded', 'true');
      btn.innerHTML = 'Less &#9652;';
    } else {
      details.style.maxHeight = '0';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = 'Learn more &#9662;';
    }
    // Recalc after CSS transition
    setTimeout(recalc, 320);
  });

  // Initial layout: run after Quarto finishes rendering
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(recalc, 50); });
  } else {
    setTimeout(recalc, 50);
  }
  window.addEventListener('resize', recalc);
})();
</script>
